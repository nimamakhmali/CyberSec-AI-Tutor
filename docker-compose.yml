version: '3.8'

services:
  # Ollama service for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: cybersec-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CyberSec AI Tutor application
  cybersec-tutor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersec-tutor
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=mistral
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - VECTOR_DB=chroma
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - DOCUMENTS_DIR=/app/data/documents
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma
      - documents_data:/app/data/documents
      - logs_data:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Optional: Ollama model puller (runs once to pull models)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: cybersec-ollama-setup
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama to be ready...'
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo 'Pulling models...'
        ollama pull mistral
        ollama pull nomic-embed-text
        echo 'Models pulled successfully!'
      "
    restart: "no"

volumes:
  ollama_data:
  chroma_data:
  documents_data:
  logs_data: